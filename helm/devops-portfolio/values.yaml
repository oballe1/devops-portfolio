# Default values for devops-portfolio
# This is a YAML-formatted file.

# Global settings
global:
  namespace: devops-portfolio

# Application settings
app:
  name: devops-portfolio
  version: "1.0.0"

# Image settings
image:
  repository: 746196583728.dkr.ecr.us-east-1.amazonaws.com/pf-site
  tag: "dev-latest"
  pullPolicy: Always

# Deployment settings
deployment:
  replicaCount: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# Container settings
container:
  port: 80
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# Health checks
# healthCheck:
  # enabled: true
  # livenessProbe:
    # httpGet:
      # path: /
      # port: 80
    # initialDelaySeconds: 30
    # periodSeconds: 10
    # timeoutSeconds: 5
    # failureThreshold: 3
  # readinessProbe:
    # httpGet:
      # path: /
      # port: 80
    # initialDelaySeconds: 5
    # periodSeconds: 5
    # timeoutSeconds: 3
    # failureThreshold: 3

# Service settings
service:
  type: ClusterIP
  port: 80
  targetPort: 80

# Ingress settings
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: site.lovethoballe.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: site-tls
      hosts:
        - site.lovethoballe.com

# Autoscaling settings
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Security Context
securityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0

# Pod Security Context
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Network Policy
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80

# ConfigMap for nginx configuration
configMap:
  enabled: false
  data:
    nginx.conf: |
      worker_processes auto;
      error_log /var/log/nginx/error.log warn;
      pid /var/run/nginx.pid;

      events {
          worker_connections 1024;
      }

      http {
          include /etc/nginx/mime.types;
          default_type application/octet-stream;

          log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

          access_log /var/log/nginx/access.log main;

          sendfile on;
          tcp_nopush on;
          tcp_nodelay on;
          keepalive_timeout 65;
          types_hash_max_size 2048;

          gzip on;
          gzip_vary on;
          gzip_min_length 1024;
          gzip_proxied any;
          gzip_comp_level 6;
          gzip_types
              text/plain
              text/css
              text/xml
              text/javascript
              application/json
              application/javascript
              application/xml+rss
              application/atom+xml
              image/svg+xml;

          include /etc/nginx/conf.d/*.conf;
      }

# Cert-Manager dependency configuration
cert-manager:
  enabled: true
  installCRDs: true
  global:
    leaderElection:
      namespace: cert-manager
  webhook:
    timeoutSeconds: 30

# NGINX Ingress Controller dependency configuration
nginx-ingress:
  enabled: true
  controller:
    replicaCount: 2
    service:
      type: LoadBalancer
    resources:
      requests:
        cpu: 100m
        memory: 90Mi
      limits:
        cpu: 200m
        memory: 256Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70

# Monitoring (if using Prometheus)
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /metrics
    labels:
      app: devops-portfolio
    namespace: monitoring

# Environment-specific overrides
environments:
  dev:
    replicaCount: 1
    autoscaling:
      enabled: false
    ingress:
      hosts:
        - host: dev-site.lovethoballe.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: dev-portfolio-tls
          hosts:
            - dev-site.lovethoballe.com

  staging:
    replicaCount: 2
    ingress:
      hosts:
        - host: staging-site.lovethoballe.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: staging-portfolio-tls
          hosts:
            - staging-site.lovethoballe.com

  prod:
    replicaCount: 3
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

# Prometheus Stack Configuration
prometheus-stack:
  enabled: true

  # Prometheus configuration
  prometheus:
    prometheusSpec:
      retention: 30d
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp2
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
      resources:
        requests:
          memory: "2Gi"
          cpu: "1000m"
        limits:
          memory: "4Gi"
          cpu: "2000m"
      serviceMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

  # Grafana configuration
  grafana:
    enabled: true
    adminPassword: "admin123"  # Change this in production
    persistence:
      enabled: true
      storageClassName: gp2
      size: 10Gi

    # Grafana ingress
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
      hosts:
        - grafana.lovethoballe.com
      tls:
        - secretName: grafana-tls
          hosts:
            - grafana.lovethoballe.com

    # Grafana resources
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "200m"

    # Dashboard provisioning
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

    dashboards:
      default:
        nginx-ingress:
          gnetId: 9614
          revision: 1
          datasource: Prometheus
        kubernetes-cluster:
          gnetId: 7249
          revision: 1
          datasource: Prometheus
        kubernetes-pods:
          gnetId: 6417
          revision: 1
          datasource: Prometheus

  # AlertManager configuration
  alertmanager:
    enabled: true
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: gp2
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "256Mi"
          cpu: "100m"

    # AlertManager ingress
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
      hosts:
        - alertmanager.lovethoballe.com
      tls:
        - secretName: alertmanager-tls
          hosts:
            - alertmanager.lovethoballe.com

  # Node Exporter
  nodeExporter:
    enabled: true

  # kube-state-metrics
  kubeStateMetrics:
    enabled: true

  # Prometheus Operator
  prometheusOperator:
    enabled: true
    admissionWebhooks:
      enabled: true
      patch:
        enabled: true