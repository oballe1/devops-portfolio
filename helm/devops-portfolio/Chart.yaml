apiVersion: v2
name: devops-portfolio
description: A Helm chart for DevOps Portfolio static website with nginx
type: application
version: 0.1.0
appVersion: "1.0.0"
home: https://github.com/lovethoballe/devops-portfolio
sources:
  - https://github.com/lovethoballe/devops-portfolio
maintainers:
  - name: Loveth Oballe Ayuknteck
    email: loveth.oballe@devopsengineer.com

keywords:
  - portfolio
  - nginx
  - static-website
  - devops

dependencies:
  # NGINX Ingress Controller
  - name: ingress-nginx
    version: "4.8.3"
    repository: https://kubernetes.github.io/ingress-nginx
    condition: nginx-ingress.enabled

  # Cert-Manager for SSL certificates
  - name: cert-manager
    version: "v1.13.2"
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled

  # Prometheus Stack for monitoring
  - name: kube-prometheus-stack
    version: "54.2.2"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus-stack.enabled

annotations:
  category: Web
  licenses: Apache-2.0